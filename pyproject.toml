[project]
name = "imgpdf2md-style-demo"
version = "0.1.0"
description = "PaddleOCR AI Studio + local visual style extraction feasibility demo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pymupdf>=1.25",
  "jieba>=0.42",
  "requests>=2.32",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.3",
]

[project.scripts]
imgpdf2md-style-demo = "style_demo:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
